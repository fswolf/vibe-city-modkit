<!doctype html><html><head><meta charset="utf-8"><title>vb-visual</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#140f22;color:#f2ecff;font:15px system-ui,sans-serif;overflow:hidden;user-select:none}
[hidden]{display:none!important}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#box{position:absolute;left:3%;right:3%;bottom:3%;height:27%;background:#1b1230e8;border:2px solid #5a3f8f;border-radius:14px;padding:24px 28px;box-shadow:0 6px 24px #0008;cursor:pointer}
#box.narr #text{font-style:italic;color:#d9cdf5}
#name{position:absolute;top:-15px;left:22px;padding:4px 16px;border-radius:999px;font-weight:700;font-size:15px;color:#fff;box-shadow:0 2px 0 #0005}
#text{font-size:clamp(15px,3.2vh,21px);line-height:1.45;white-space:pre-wrap}
#more{position:absolute;right:18px;bottom:10px;color:#00e3d2;font-size:14px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;background:#2c2148d9;border:1px solid #4a3878;font-size:13px}
button:hover{background:#3a2c60}button.on{border-color:#00e3d2;color:#00e3d2}button:disabled{opacity:.4;cursor:default}
#bar{position:absolute;top:10px;right:10px;display:flex;gap:6px}
#choices{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:10px;min-width:46%;max-width:92%}
#choices.row{flex-direction:row;flex-wrap:wrap;justify-content:center}#choices.row button{flex:1 1 0;min-width:160px}
#choices.grid{display:grid;grid-template-columns:1fr 1fr}
#choices button{padding:13px 20px;font-size:17px;background:#241a3cf0;border-color:#6a4fa8;text-align:center}
#choices button:hover{border-color:#ff168d}
#choices b{color:#00e3d2;margin-right:10px}
.over{position:absolute;inset:0;display:grid;place-items:center;background:#0b0716d0;text-align:center}
.over .in{display:flex;flex-direction:column;align-items:center;gap:12px}
#tname{font-size:46px;margin:0;color:#ff168d;letter-spacing:.06em;text-shadow:0 0 22px #ff168d88}
#tsub{color:#a99cc8;margin:0 0 10px}
#title button{min-width:190px;text-align:center;padding:11px 16px;font-size:16px}
#tend{color:#a99cc8;font-size:13px;margin-top:6px}
#gallery{place-items:stretch;padding:34px 7%;grid-template-rows:auto 1fr auto;gap:14px;text-align:left}
#gallery h2{margin:0;color:#ff168d;letter-spacing:.12em;font-size:26px}
#glist{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
#glist button{display:flex;flex-direction:column;gap:6px;padding:0;overflow:hidden;border-radius:12px;background:#241a3cf0;border-color:#6a4fa8}
#glist button:hover{border-color:#ff168d}#glist img,#glist .ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:#120c20;display:grid;place-items:center;color:#5a4a7a;font-size:30px}
#glist span{padding:0 12px 11px;font-size:15px}#glist button.lock{opacity:.5;cursor:default}
#gallery .foot{display:flex;justify-content:space-between;align-items:center;color:#a99cc8;font-size:13px}
#gate h2{margin:0;color:#ff168d;font-size:30px;letter-spacing:.1em}#gate p{max-width:520px;line-height:1.5;color:#d9cdf5}
#endcard{cursor:pointer}#endcard h2{font-size:40px;margin:0;color:#ff168d;letter-spacing:.2em}#endname{font-size:20px;color:#00e3d2}
#endcard small{color:#a99cc8}
#log{place-items:stretch;padding:40px 8%;grid-template-rows:100%}
#loglist{overflow:auto;text-align:left;line-height:1.5;font-size:15px;padding-right:10px}
#loglist p{margin:0 0 10px}#loglist b{color:#00e3d2}
#paused{font-size:22px;letter-spacing:.2em;cursor:pointer}
#help{position:absolute;left:12px;top:12px;font-size:11px;color:#a99cc8aa}
</style></head><body>
<canvas id="stage"></canvas>
<div id="box" hidden><div id="name"></div><div id="text"></div><div id="more">&#9660;</div></div>
<div id="choices" hidden></div>
<div id="bar" hidden><button id="autobtn">Auto</button><button id="logbtn">Log</button><button id="pausebtn">Pause</button><button id="menubtn">Menu</button></div>
<div id="title" class="over" hidden><div class="in"><h1 id="tname"></h1><p id="tsub"></p>
  <button id="contbtn">Continue</button><button id="newbtn">New story</button><button id="scenesbtn" hidden>Scenes</button><div id="tend"></div></div>
  <div id="help">Click, Space or Enter to read on. 1 to 9 picks a choice. A auto, L log, P pause, Esc closes.</div></div>
<div id="endcard" class="over" hidden><div class="in"><h2>THE END</h2><div id="endname"></div><small>Click to return to the title</small></div></div>
<div id="gallery" class="over" hidden><h2 id="gtitle">Scenes</h2><div id="glist"></div><div class="foot"><span id="gcount"></span><button id="gback">Back</button></div></div>
<div id="gate" class="over" hidden><div class="in"><h2>Adults only</h2><p id="gatetext"></p><button id="gateyes">I am 18 or older</button><button id="gateno">Leave</button></div></div>
<div id="log" class="over" hidden><div id="loglist"></div></div>
<div id="paused" class="over" hidden>PAUSED</div>
<script src="af.js"></script><script src="actors.js"></script><script src="story.js"></script><script src="vn.js"></script>
</body></html>
